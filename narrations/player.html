<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Book narration</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #fff; color: #222;
      font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(520px, calc(100% - 32px)); }
    audio { display: block; width: 100%; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0;
      margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0);
      white-space: nowrap; border: 0;
    }
    [role="status"] { text-align: center; }
  </style>
</head>
<body>
  <main id="player"></main>
  <script>
    (async () => {
      'use strict';
      const root = document.getElementById('player');
      const normalize = path => path.replace(/\/+$/, '') || '/';
      const requestedPath = normalize(window.location.pathname);

      const unavailable = () => {
        root.replaceChildren();
        const status = document.createElement('p');
        status.setAttribute('role', 'status');
        status.textContent = 'Narration is not available yet.';
        root.appendChild(status);
      };

      try {
        const response = await fetch('/narrations/books.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Narration catalog unavailable');
        const catalog = await response.json();
        const books = Array.isArray(catalog.books) ? catalog.books : [];
        const book = books.find(item =>
          normalize('/listen/' + item.slug) === requestedPath ||
          (Array.isArray(item.legacyPaths) &&
            item.legacyPaths.some(path => normalize(path) === requestedPath))
        );

        if (!book || typeof book.audioSrc !== 'string' ||
            !/^\/narrations\/audio\/[\w.-]+\.(mp3|m4a|ogg)$/i.test(book.audioSrc)) {
          unavailable();
          return;
        }

        document.title = book.title + ' — Narration';
        const heading = document.createElement('h1');
        heading.className = 'sr-only';
        heading.textContent = book.title;
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'metadata';
        audio.setAttribute('aria-label', book.title + ' narration');
        audio.src = book.audioSrc;
        audio.addEventListener('error', unavailable, { once: true });
        root.replaceChildren(heading, audio);
      } catch {
        unavailable();
      }
    })();
  </script>
</body>
</html>
